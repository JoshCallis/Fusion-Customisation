<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser</title>
<link rel="stylesheet" href="/theme.css">
<script src="/appearance.js"></script>
<script src="/fit_popups.js"></script>
<script src="/browser_sel.js"></script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <!-- The appearances palette (view menu ▸ Appearances): drag a swatch onto a row.
       On top, since the band below the last row passes through to the viewport. -->
  <div id="palette" hidden></div>
  <div id="tree" class="fscroll" tabindex="-1"><div id="waiting">waiting for Fusion…</div></div>
  <div id="ctx"></div>
  <!-- Drag affordances (kept outside #tree so render() rebuilding the tree can't
       wipe them mid-drag): the reorder insertion line and the cursor-following ghost. -->
  <div id="drop-line"></div>
  <div id="drag-ghost"></div>

<!-- Every word starts with a capital — shared house rule, see fusion_ui. -->
<script src="/capitalise.js"></script>
<!-- The structured parameter-naming convention. The tree reads a parameter's groups
     and its label off its name with this (see "name groups" in index.js). -->
<script src="/param_naming.js"></script>
<!-- Chord spelling and the ⌘, Hotkeys panel, shared with the Params window. -->
<script src="/keys.js"></script>
<!-- What a timeline item is called on screen (fusion_ui/tl_names.js). -->
<script src="/tl_names.js"></script>
<!-- The glyph a timeline item draws (fusion_ui/tl_icons.js). -->
<script src="/tl_icons.js"></script>
<!-- The window-only timeline groups, shared (fusion_ui/tl_groups.js). -->
<script src="/tl_groups.js"></script>

<script src="/menu_aim.js"></script>
<script src="/index.js"></script>
<!-- Claude asks: what the pointer is over (ask/ask.js, served by the bridge) -->
<script src="http://127.0.0.1:8760/ask.js" async></script>
</body>
</html>
